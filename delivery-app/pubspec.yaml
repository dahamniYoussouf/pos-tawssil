name: delivery_app
description: Tawsil delivery platform - Delivery App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  get_it: ^8.0.3
  pretty_dio_logger: ^1.4.0
  google_fonts: ^4.0.4
  path_provider: ^2.1.1
  intl: ^0.20.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  permission_handler: ^11.0.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.1
  audioplayers: ^6.1.1
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  meta: ^1.16.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/wilayas.json
    - assets/images/svg/
    - assets/sounds/
  fonts:
    - family: Gilmer
      fonts:
        - asset: assets/fonts/Gilmer-Regular.ttf
          weight: 300
        - asset: assets/fonts/Gilmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilmer-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_icon.png"
