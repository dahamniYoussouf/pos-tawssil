name: frontend
description: Tawsil delivery platform frontend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  geocoding: ^2.1.1
  http: ^1.5.0  
  google_fonts: ^4.0.4
  app_settings: ^5.1.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  geolocator_web: ^2.2.1
  geocoding_platform_interface: ^3.2.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/map_background.png
    - assets/permission_map.png
    - assets/icons/pizza.png
    - assets/icons/burger.png
    - assets/icons/sandwich.png
    - assets/icons/tacos.png
    - assets/images/restaurants/
    - assets/icons/tawwsil.png
    - assets/icons/
    - assets/images/