name: client_app
description: Tawsil delivery platform - Client App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  geocoding: ^2.1.1
  http: ^1.5.0
  google_fonts: ^4.0.4
  app_settings: ^5.1.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  path_provider: ^2.1.1
  geolocator_web: ^2.2.1
  geocoding_platform_interface: ^3.2.0
  google_maps_flutter: ^2.5.0
  flutter_polyline_points: ^2.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  pretty_dio_logger: ^1.4.0
  get_it: ^8.0.3

  flutter_cache_manager: ^3.3.1
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.5
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.1.1
  socket_io_client: ^2.0.3+1
  easy_refresh: ^3.4.0

dependency_overrides:
  meta: ^1.16.0
  photo_manager: ^3.6.4
  win32: ^5.12.0
  flutter_dio_http_cache: ^0.3.1
  dio: ^5.8.0+1
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/map_background.png
    - assets/permission_map.png
    - assets/icons/pizza.png
    - assets/icons/burger.png
    - assets/icons/sandwich.png
    - assets/icons/tacos.png
    - assets/images/restaurants/
    - assets/icons/tawwsil.png
    - assets/icons/
    - assets/images/
    - assets/images/svg/app_icon.svg
    - assets/images/splash_screen_icon.png
    - assets/images/app_icon.png
    - assets/images/svg/
  fonts:
    - family: Gilmer
      fonts:
        - asset: assets/fonts/Gilmer-Regular.ttf
          weight: 300
        - asset: assets/fonts/Gilmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilmer-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_24pt-black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
