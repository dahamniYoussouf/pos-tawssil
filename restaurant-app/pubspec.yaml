name: restaurant_app
description: Tawsil delivery platform - Restaurant App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  geocoding: ^2.1.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.5
  flutter_secure_storage: ^9.0.0
  get_it: ^8.0.3
  pretty_dio_logger: ^1.4.0
  google_fonts: ^4.0.4
  path_provider: ^2.1.1
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  meta: ^1.16.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_icon.png"
