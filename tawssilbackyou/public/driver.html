<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver - Tawssil Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050a12;
      color: #f8fafc;
      --accent: #10b981;
      --accent-dark: #047857;
      --panel: #0f172a;
      --panel-soft: #111b2c;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #020617, #0f172a);
      color: #f8fafc;
    }
    .driver-shell {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 1rem;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .driver-sidebar,
    .driver-log,
    .driver-main > .panel {
      background: var(--panel);
      border-radius: 24px;
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 35px 60px rgba(0,0,0,0.45);
    }
    .driver-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #050a12;
    }
    .brand {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f8fafc;
    }
    .brand span { font-size: 0.9rem; color: var(--accent); }
    .sidebar-card {
      background: var(--panel-soft);
      border-radius: 18px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-card h2 { margin: 0; font-size: 1.1rem; color: #f8fafc; }
    input, select, button, textarea { font-family: inherit; }
    .sidebar-card input,
    .sidebar-card select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0f172a;
      color: #f8fafc;
    }
    .sidebar-card button {
      border: none;
      border-radius: 12px;
      padding: 0.8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(16,185,129,0.35);
    }
    .status-pill {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(16,185,129,0.2);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.8rem;
    }
    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }
    #online_btn {
      border-radius: 12px;
      border: none;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 15px 25px rgba(16,185,129,0.35);
    }
    .capacity {
      border: 1px solid rgba(255,255,255,0.1);
      background: #111b2c;
    }
    .capacity-info {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .capacity-bar {
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      overflow: hidden;
      height: 28px;
    }
    .capacity-fill {
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      height: 100%;
      width: 0;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .driver-main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--panel-soft);
      border: none;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 { margin: 0; font-size: 1.4rem; color: #f8fafc; }
    .panel-header button {
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .panel .empty { margin: 0; color: #a5b4fc; }
    .log-panel { background: #020617; }
    .log-panel h2 { color: #f8fafc; margin: 0 0 0.6rem; }
    .log-panel .log {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.9rem;
      height: 100%;
    }
    .tabs {
      display: flex;
      gap: 0.6rem;
    }
    .tab {
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #f8fafc;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
    }
    .tab-content {
      display: none;
      flex-direction: column;
      gap: 0.85rem;
    }
    .tab-content.active { display: flex; }
    #d_deliveries .card,
    #nearby_deliveries .card {
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem;
      background: #111b2c;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      color: #f8fafc;
    }
    #d_deliveries .card.highlight {
      border-color: var(--accent);
      box-shadow: 0 20px 30px rgba(16,185,129,0.25);
    }
    .tabs .badge {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
      font-size: 0.75rem;
    }
    @media (max-width: 1100px) {
      .driver-shell { grid-template-columns: 1fr; }
      .driver-log { order: -1; }
    }
  </style>
  <script>
    function loadFirebaseFallback() {
      if (window.__firebaseFallbackLoading) return;
      window.__firebaseFallbackLoading = true;
      const app = document.createElement('script');
      app.src = '/firebase/firebase-app-compat.js';
      app.defer = true;
      const msg = document.createElement('script');
      msg.src = '/firebase/firebase-messaging-compat.js';
      msg.defer = true;
      document.head.appendChild(app);
      document.head.appendChild(msg);
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js" onerror="loadFirebaseFallback()"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging-compat.js" onerror="loadFirebaseFallback()"></script>
</head>
<body>
  <div class="driver-shell">
    <aside class="driver-sidebar">
      <div class="brand">
        <strong>Driver Portal</strong>
        <span>Live</span>
      </div>
      <div class="sidebar-card">
        <h2>Connexion</h2>
        <input id="d_email" placeholder="Email" type="email" value="driver5@example.com">
        <input id="d_password" type="password" placeholder="Password" value="password123">
        <button onclick="driverLogin()">Login</button>
        <div id="login_status" class="status-badge" style="display:none"></div>
      </div>
      <div class="sidebar-card">
        <h2>Statut</h2>
        <select id="status_select" onchange="changeStatus()" disabled>
          <option value="available">Available</option>
          <option value="busy">Busy</option>
          <option value="offline">Offline</option>
          <option value="suspended">Suspended</option>
        </select>
        <div id="status_info"></div>
      </div>
      <div class="sidebar-card">
        <h2>Position</h2>
        <div class="location-grid">
          <input id="d_lat" placeholder="Latitude" value="36.75">
          <input id="d_lng" placeholder="Longitude" value="2.8">
        </div>
        <button id="online_btn" onclick="toggleOnline()" disabled>Go Online</button>
        <div id="driver_status"></div>
      </div>
      <div class="sidebar-card capacity" id="capacity_display" style="display:none">
        <h2>Capacité</h2>
        <div class="capacity-info">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>Active Orders</strong>
            <span id="capacity_text">0 / 5</span>
          </div>
          <div class="capacity-bar">
            <div id="capacity_fill" class="capacity-fill">0%</div>
          </div>
          <div style="font-size:0.85rem;color:#475569;">
            <span id="capacity_message">Ready to accept orders</span>
          </div>
        </div>
      </div>
    </aside>
    <main class="driver-main">
      <section class="panel" id="active_orders_section" style="display:none">
        <div class="panel-header">
          <h2>My Active Orders</h2>
          <button onclick="loadActiveOrders()">Refresh</button>
        </div>
        <div id="active_orders_list">
          <div class="empty">No active orders</div>
        </div>
      </section>
      <section class="panel" id="deliveries_section" style="display:none">
        <div class="panel-header">
          <h2>Available Deliveries</h2>
        </div>
        <div class="tabs">
          <button class="tab active" onclick="switchTab('available')">
            Available <span class="badge" id="available_count">0</span>
          </button>
          <button class="tab" onclick="switchTab('nearby')">Nearby</button>
        </div>
        <div id="tab_available" class="tab-content active">
          <div id="d_deliveries">
            <div class="empty">No deliveries available. Go online to receive requests!</div>
          </div>
        </div>
        <div id="tab_nearby" class="tab-content">
          <button onclick="loadNearbyOrders()">Refresh Nearby</button>
          <div id="nearby_deliveries">
            <div class="empty">Click refresh to load nearby orders</div>
          </div>
        </div>
      </section>
    </main>
    <aside class="driver-log">
      <section class="panel">
        <h2>Activity Log</h2>
        <pre id="d_log" class="log">Waiting for connection...</pre>
        <div id="driver_notifications"></div>
      </section>
    </aside>
  </div>
  <script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDuWuOT_PzhonVC8jIZn9OqxSHruOrDobc",
  authDomain: "tawssi.firebaseapp.com",
  projectId: "tawssi",
  storageBucket: "tawssi.firebasestorage.app",
  messagingSenderId: "746654963305",
  appId: "1:746654963305:web:a9858d9e05dc50b84bb4f8"
};
const FIREBASE_VAPID_KEY = "BEf8u4HbFK1KyTnYqhFGFnrvY9QFjMdTaktOiP60T1NrLov7odAhqtvMqmouPW_DkyVRNH5LkW94OAGUNULmoUw";

let messaging = null;
let fcmToken = null;
let swRegistration = null;
let firebaseInitPromise = null;
let auth = {role: null, token: null, user: null, profile: null};
let isOnline = false;
let locationInterval = null;
let activeOrders = [];
let maxCapacity = 5;

async function apiFetch(url, options = {}) {
  const token = auth.token || '';
  const headers = {
    'Content-Type': 'application/json',
    ...(options.headers || {}),
    ...(token ? { Authorization: `Bearer ${token}` } : {})
  };
  const response = await fetch(url, { ...options, headers });
  return response;
}

function log(...msg) {
  const e = document.getElementById('d_log');
  e.textContent = `[${new Date().toLocaleTimeString()}] ${msg.join(' ')}\n` + e.textContent;
}

function resolveOrderId(data = {}) {
  return data.orderId || data.order_id || data.id || data.order?.id || null;
}

function resolveOrderNumber(data = {}) {
  return data.orderNumber || data.order_number || data.order?.order_number || resolveOrderId(data) || 'N/A';
}

function resolveDistanceKm(data = {}) {
  const raw = data.distance ?? data.distance_km ?? data.distanceKm ?? null;
  if (raw === null || raw === undefined) return null;
  const parsed = Number(raw);
  return Number.isFinite(parsed) ? parsed : null;
}

function resolveDeliveryFee(data = {}) {
  const raw = data.fee ?? data.delivery_fee ?? data.deliveryFee ?? data.total_fee ?? null;
  if (raw === null || raw === undefined) return 0;
  const parsed = Number(raw);
  return Number.isFinite(parsed) ? parsed : raw;
}

function resolveDeliveryAddress(data = {}) {
  return data.deliveryAddress || data.delivery_address || data.address || data.delivery_location || 'Not specified';
}

function resolveRestaurantName(data = {}) {
  return data.restaurant || data.restaurant_name || data.restaurantName || data.restaurant?.name || 'Restaurant';
}

function pushDriverNotificationCard(title, message, tone = 'info') {
  const box = document.getElementById('driver_notifications');
  if (!box) return;
  const note = document.createElement('div');
  note.className = 'card';
  note.style.margin = '8px 0';
  note.style.border = tone === 'error'
    ? '1px solid #ef4444'
    : tone === 'warning'
      ? '1px solid #f59e0b'
      : '1px solid rgba(255,255,255,0.1)';
  note.style.background = tone === 'error'
    ? '#2a0b0b'
    : tone === 'warning'
      ? '#2a2105'
      : '#111b2c';
  note.innerHTML = `<strong>${title}</strong><div style="margin-top:6px;font-size:13px;color:#e2e8f0">${message}</div>`;
  box.prepend(note);
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
  document.getElementById(`tab_${tabName}`).classList.add('active');
}

function updateCapacity() {
  const count = activeOrders.length;
  const percentage = (count / maxCapacity) * 100;
  
  document.getElementById('capacity_text').textContent = `${count} / ${maxCapacity}`;
  document.getElementById('capacity_fill').style.width = `${percentage}%`;
  document.getElementById('capacity_fill').textContent = `${Math.round(percentage)}%`;
  document.getElementById('active_count').textContent = count;
  
  const fill = document.getElementById('capacity_fill');
  if (count >= maxCapacity) {
    fill.classList.add('full');
    document.getElementById('capacity_message').textContent = '⚠️ At maximum capacity';
  } else {
    fill.classList.remove('full');
    const remaining = maxCapacity - count;
    document.getElementById('capacity_message').textContent = `Can accept ${remaining} more order${remaining !== 1 ? 's' : ''}`;
  }
}

function waitForFirebaseReady(timeoutMs = 6000) {
  if (firebaseInitPromise) return firebaseInitPromise;
  firebaseInitPromise = new Promise((resolve) => {
    const start = Date.now();
    const timer = setInterval(() => {
      if (window.firebase && firebase.messaging) {
        clearInterval(timer);
        resolve(true);
        return;
      }
      if (Date.now() - start > timeoutMs) {
        clearInterval(timer);
        resolve(false);
      }
    }, 120);
  });
  return firebaseInitPromise;
}

function parseFirebasePayload(payload = {}) {
  const data = {};
  const raw = payload.data || {};
  Object.entries(raw).forEach(([key, value]) => {
    if (value === undefined || value === null) return;
    if (typeof value !== 'string') {
      data[key] = value;
      return;
    }
    const trimmed = value.trim();
    if (
      (trimmed.startsWith('{') && trimmed.endsWith('}')) ||
      (trimmed.startsWith('[') && trimmed.endsWith(']'))
    ) {
      try {
        data[key] = JSON.parse(trimmed);
        return;
      } catch (_err) {
        // keep string
      }
    }
    data[key] = value;
  });

  if (payload.notification) {
    if (!data.title && payload.notification.title) data.title = payload.notification.title;
    if (!data.body && payload.notification.body) data.body = payload.notification.body;
  }

  if (data.body && !data.message) data.message = data.body;
  return data;
}

function resolveEventType(data = {}) {
  return data.event || data.type || data.notification_type || data.notificationType || null;
}

async function registerDeviceToken(token) {
  if (!auth.token || !token) return;
  const deviceId = `web-${auth.role || 'driver'}-${auth.user?.id || auth.profile?.id || 'guest'}`;

  try {
    const r = await apiFetch('/notifications/token', {
      method: 'POST',
      body: JSON.stringify({
        token,
        platform: 'web',
        device_id: deviceId
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      log('⚠️ Token registration failed:', j.message || r.status);
      return;
    }
    log('✅ Firebase token registered');
  } catch (err) {
    log('⚠️ Token registration error:', err.message);
  }
}

function handleFirebaseMessage(payload = {}) {
  const data = parseFirebasePayload(payload);
  const event = resolveEventType(data);

  log('📬 Firebase message:', JSON.stringify(data));

  if (event === 'order_broadcast') {
    log('📡 BROADCAST: New order available somewhere');
    const availableCount = document.getElementById('available_count');
    availableCount.textContent = parseInt(availableCount.textContent || 0) + 1;
    return;
  }

  if (event === 'admin_broadcast') {
    const title = data.title || data.type || 'Admin broadcast';
    const message = data.message || data.body || '';
    log('📣 Admin broadcast:', title, message);
    pushDriverNotificationCard(`📣 ${title}`, message || 'Message reçu', data.type === 'urgent' ? 'warning' : 'info');
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body: message || 'Admin broadcast received', icon: '📣' });
    }
    return;
  }

  if (event === 'config_update') {
    log('⚙️ Config update:', JSON.stringify(data));
    if (data?.max_orders_per_driver) {
      maxCapacity = Number(data.max_orders_per_driver) || maxCapacity;
      updateCapacity();
      updateAvailableDeliveryButtons();
    }
    if (data?.message) {
      pushDriverNotificationCard('⚙️ Config update', data.message, 'info');
    }
    return;
  }

  if (event === 'driver:cancellation_threshold') {
    const message = data?.message || 'Cancellation threshold reached';
    const count = data?.cancellation_count ?? 'N/A';
    log('⚠️ Cancellation warning:', message);
    pushDriverNotificationCard('⚠️ Attention', `${message} (annulations: ${count})`, 'warning');
    playNotificationSound();
    return;
  }

  handleDriverNotification(data);
}

async function initFirebaseMessaging() {
  if (messaging) {
    log('⚠️ Firebase already initialized');
    return;
  }

  const ready = await waitForFirebaseReady();
  if (!ready) {
    log('⚠️ Firebase SDK not loaded');
    return;
  }

  if (!firebase.apps?.length) {
    firebase.initializeApp(FIREBASE_CONFIG);
  }

  if (!('serviceWorker' in navigator)) {
    log('⚠️ Service worker not supported in this browser');
    return;
  }

  try {
    swRegistration = await navigator.serviceWorker.register('/api/firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
  } catch (err) {
    log('⚠️ Service worker registration failed:', err.message);
    return;
  }

  messaging = firebase.messaging();

  if (!('Notification' in window)) {
    log('⚠️ Notifications not supported in this browser');
    return;
  }

  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }

  if (Notification.permission !== 'granted') {
    log('⚠️ Notifications permission denied');
  } else {
    try {
      fcmToken = await messaging.getToken({
        vapidKey: FIREBASE_VAPID_KEY,
        serviceWorkerRegistration: swRegistration
      });
      if (fcmToken) {
        localStorage.setItem('fcm_token', fcmToken);
        await registerDeviceToken(fcmToken);
      } else {
        log('⚠️ Unable to get Firebase token');
      }
    } catch (err) {
      log('⚠️ Firebase token error:', err.message);
    }
  }

  messaging.onMessage((payload) => {
    handleFirebaseMessage(payload);
  });

  log('✅ Firebase messaging initialized');
  document.getElementById('online_btn').disabled = false;
  loadActiveOrders();
}
function handleDriverNotification(data = {}) {
  const type = data.type || data.event || data.notification_type;
  const orderId = resolveOrderId(data);
  const orderNumber = resolveOrderNumber(data);
  const message = data.message || data.body || '';

  log('📬 Notification:', JSON.stringify(data));

  if (type === 'new_delivery') {
    handleNewDelivery(data);
    return;
  }

  if (type === 'order_assigned') {
    log(`✅ Order #${orderNumber} assigned to you`);
    loadActiveOrders();
    updateCapacity();
    updateAvailableDeliveryButtons();
    return;
  }

  if (type === 'delivery_complete') {
    log(`✅ Delivery completed! ${data.active_orders_count ?? ''}`.trim());
    loadActiveOrders();
    updateCapacity();
    updateAvailableDeliveryButtons();
    return;
  }

  if (type === 'delivery_cancelled' || type === 'order_cancelled') {
    log(`⚠️ Order #${orderNumber} cancelled`);
    loadActiveOrders();
    updateCapacity();
    updateAvailableDeliveryButtons();
    return;
  }

  if (!type && orderId && data.restaurant) {
    handleNewDelivery(data);
    return;
  }

  if (message) {
    pushDriverNotificationCard('📬 Notification', message, 'info');
  }
}

function handleNewDelivery(data) {
  const orderId = resolveOrderId(data);
  const orderNumber = resolveOrderNumber(data);
  const distance = resolveDistanceKm(data);
  const fee = resolveDeliveryFee(data);
  const deliveryAddress = resolveDeliveryAddress(data);
  const restaurantName = resolveRestaurantName(data);

  log('🚨 Processing new delivery...');
  log('Order:', orderNumber, '| Distance:', distance ?? '?', 'km');
  
  const box = document.getElementById('d_deliveries');
  if (box.querySelector('.empty')) box.innerHTML = '';
  
  const div = document.createElement('div');
  div.className = 'card highlight';
  div.id = `delivery_${orderId || orderNumber || Date.now()}`;
  
  // ✅ Check if driver can accept more orders
  const canAccept = activeOrders.length < maxCapacity && !!orderId;
  const buttonDisabled = canAccept ? '' : 'disabled style="opacity:0.5;cursor:not-allowed"';
  const buttonText = !orderId ? '⚠️ Missing Order ID' : canAccept ? '✅ Accept Delivery' : '⚠️ At Capacity';
  
  div.innerHTML = `
    <div class="delivery-badge">NEW!</div>
    <strong class="order-number">Order #${orderNumber}</strong>
    <div class="location-info">
      <strong>📍 Distance:</strong> ${distance ?? '?'} km<br>
      <strong>💰 Delivery Fee:</strong> ${fee || 0} DA<br>
      <strong>📍 Address:</strong> ${deliveryAddress}<br>
      <strong>🍴 Restaurant:</strong> ${restaurantName}
    </div>
    <button class="success" onclick="acceptDelivery('${orderId || ''}')" ${buttonDisabled}>${buttonText}</button>
  `;
  box.prepend(div);
  
  // Update available count
  const availableCount = document.getElementById('available_count');
  availableCount.textContent = box.querySelectorAll('.card:not(.capacity-warning)').length;
  
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('New Delivery Available! 🚨', {
      body: `Order #${orderNumber} - ${distance ?? '?'} km away - ${fee || 0} DA`,
      icon: '🛵',
      requireInteraction: true
    });
  }
  
  playNotificationSound();
}
async function loadActiveOrders() {
  if (!auth.profile?.id) return;
  
  log('📡 Loading active orders...');
  
  try {
    const res = await apiFetch('/api/driver/active-orders');
    const data = await res.json();
    
    if (res.ok) {
      activeOrders = data.data?.active_orders || [];
      maxCapacity = data.data?.capacity || 5;
      
      renderActiveOrders();
      updateCapacity();
      
      document.getElementById('active_orders_section').style.display = 'block';
      document.getElementById('capacity_display').style.display = 'block';
      
      log(`✅ Loaded ${activeOrders.length} active orders`);
    } else {
      log('❌ Failed to load active orders:', data.message);
    }
  } catch (error) {
    log('❌ Error loading active orders:', error.message);
  }
}

function renderActiveOrders() {
  const box = document.getElementById('active_orders_list');
  
  if (activeOrders.length === 0) {
    box.innerHTML = '<div class="empty">No active orders</div>';
    return;
  }
  
  box.innerHTML = '';
  
  activeOrders.forEach((order, index) => {
    const div = document.createElement('div');
    div.className = 'card active-order';
    div.setAttribute('data-order', order.id);
    
    // ✅ Dynamic status badge color
    let statusBadgeClass = order.status;
    if (order.status === 'arrived') statusBadgeClass = 'delivering';
    
    div.innerHTML = `
      <strong class="order-number">#${order.order_number}</strong>
      <span class="status-badge ${statusBadgeClass}">${order.status.toUpperCase()}</span>
      
      <div class="order-route">
        <div class="route-step ${['assigned', 'arrived'].includes(order.status) ? 'current' : ''}">
          <div class="route-step-icon">🍴</div>
          <div>
            <strong>${order.restaurant.name}</strong><br>
            <small style="color:#666">${order.restaurant.address}</small>
          </div>
        </div>
        <div class="route-step ${order.status === 'delivering' ? 'current' : ''}">
          <div class="route-step-icon">📍</div>
          <div>
            <strong>Delivery Address</strong><br>
            <small style="color:#666">${order.delivery_address}</small>
          </div>
        </div>
      </div>
      
      <div class="location-info">
        <strong>💰 Amount:</strong> ${order.total_amount} DA<br>
        <strong>📞 Client:</strong> Contact via app<br>
        <strong>⏰ Assigned:</strong> ${new Date(order.assigned_at).toLocaleTimeString()}
      </div>
      
      <div class="order-actions">
        <button onclick="showRoutePreview('${order.id}')">🔎 Distances</button>
        
        ${order.status === 'assigned' ? `
          <button onclick="markArrived('${order.id}')">📍 Arrived at Restaurant</button>
        ` : ''}
        
        ${order.status === 'arrived' ? `
          <button class="success" onclick="startDelivery('${order.id}')">🚀 Start Delivery</button>
        ` : ''}
        
        ${order.status === 'delivering' ? `
          <button class="success" onclick="completeDelivery('${order.id}')">✅ Complete Delivery</button>
        ` : ''}
        
        <button class="danger" onclick="cancelOrder('${order.id}')">❌ Cancel</button>
      </div>
      <div class='route-preview'></div>
    `;
    box.appendChild(div);
  });
}
async function loadNearbyOrders() {

  log('📍 Loading nearby orders...');
  
  try {
    const res = await apiFetch('/api/order/nearby?radius=5000&pageSize=20');
    const data = await res.json();
    
    if (res.ok) {
      const orders = data.data || [];
      const box = document.getElementById('nearby_deliveries');
      
      if (orders.length === 0) {
        box.innerHTML = '<div class="empty">No nearby orders found</div>';

async function driverLogin() {
  const email = document.getElementById('d_email').value;
  const password = document.getElementById('d_password').value;
  
  if (!email || !password) {
    alert('Please enter email and password');
    return;
  }
  
  log('🔐 Logging in...');
  
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password, type:'driver'})
    });
    
    const j = await r.json();
    
    if (r.ok) {
      auth = {role: 'driver', token: j.access_token, user: j.user, profile: j.profile};
      
      document.getElementById('login_status').style.display = 'inline-block';
      document.getElementById('login_status').textContent = '✅ ' + (j.profile?.first_name || j.user.email);
      
      log('✅ LOGGED IN');
      log('Driver Profile ID:', j.profile?.id);
      
      if (!j.profile?.id) {
        alert('⚠️ No driver profile found!');
        document.getElementById('online_btn').disabled = true;
        return;
      }
      
      initFirebaseMessaging();
      document.getElementById('status_select').disabled = false;
      document.getElementById('deliveries_section').style.display = 'block';
      loadCurrentStatus();
    } else {
      alert('Login failed: ' + (j.message || 'Unknown'));
      log('❌ Failed:', j.message);
    }
  } catch (e) {
    alert('Error: ' + e.message);
    log('❌ Error:', e.message);
  }
}

async function changeStatus() {
  if (!auth.profile?.id) {
    alert('Please login first');
    return;
  }
  
  const newStatus = document.getElementById('status_select').value;
  
  if (newStatus === 'busy' && activeOrders.length === 0) {
    alert('Cannot set Busy manually. System sets it when you accept deliveries.');
    loadCurrentStatus();
    return;
  }
  
  if ((newStatus === 'offline' || newStatus === 'available') && activeOrders.length > 0) {
    alert('Cannot change status while having active deliveries!');
    loadCurrentStatus();
    return;
  }
  
  log('🔄 Changing status to:', newStatus);
  
  try {
    const res = await apiFetch(`/api/driver/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status: newStatus })
    });
    
    const data = await res.json();
    
    if (res.ok) {
      log('✅ Status updated to:', newStatus);
      updateStatusInfo(newStatus);
      isOnline = (newStatus === 'available');
      updateOnlineStatus();
    } else {
      alert('Error: ' + (data.message || 'Failed to update status'));
      log('❌ Failed:', data.message);
      loadCurrentStatus();
    }
  } catch (e) {
    alert('Error: ' + e.message);
    log('❌ Error:', e.message);
    loadCurrentStatus();
  }
}

async function loadCurrentStatus() {
  if (!auth.profile?.id) return;
  
  try {
    const res = await apiFetch(`/api/driver/${auth.profile.id}`);
    const data = await res.json();
    
    if (res.ok && data.data) {
      const driver = data.data;
      document.getElementById('status_select').value = driver.status;
      updateStatusInfo(driver.status);
      auth.profile.status = driver.status;
      isOnline = (driver.status === 'available');
      updateOnlineStatus();
    }
  } catch (e) {
    log('⚠️ Failed to load status:', e.message);
  }
}

function updateStatusInfo(status) {
  const info = document.getElementById('status_info');
  const messages = {
    available: '✅ You are available and will receive delivery requests',
    busy: '⚠️ You are busy with active deliveries',
    offline: '🔴 You are offline and will not receive requests',
    suspended: '⛔ Your account is suspended. Contact support.'
  };
  info.textContent = messages[status] || '';
  info.style.color = status === 'suspended' ? '#dc2626' : '#666';
}

async function toggleOnline() {
  if (!auth.profile?.id) {
    alert('No driver profile!');
    return;
  }

  const lat = parseFloat(document.getElementById('d_lat').value);
  const lng = parseFloat(document.getElementById('d_lng').value);

  if (isNaN(lat) || isNaN(lng)) {
    alert('Invalid coordinates');
    return;
  }

  isOnline = !isOnline;

  if (isOnline) {
    log('🟢 GOING ONLINE...');

    try {
      const statusRes = await apiFetch(`/api/driver/status`, { 
        method: 'PATCH', 
        body: JSON.stringify({ status: 'available' }) 
      });

      if (!statusRes.ok) throw new Error('Failed to update status');

      const locationRes = await apiFetch(`/api/order/drivers/${auth.profile.id}/gps`, {
        method: 'PUT',
        body: JSON.stringify({ longitude: lng, latitude: lat })
      });
      if (!locationRes.ok) throw new Error('Failed to update location');

      log('✅ NOW ONLINE');
      log(`Location: (${lat}, ${lng})`);

      document.getElementById('status_select').value = 'available';
      updateStatusInfo('available');

      locationInterval = setInterval(() => {
        const lat = parseFloat(document.getElementById('d_lat').value);
        const lng = parseFloat(document.getElementById('d_lng').value);
        if (!isNaN(lat) && !isNaN(lng)) {
          apiFetch(`/api/order/drivers/${auth.profile.id}/gps`, {
            method: 'PUT',
            body: JSON.stringify({ longitude: lng, latitude: lat })
          }).then(() => log('📍 Location updated'));
        }
      }, 30000);

    } catch (e) {
      log('❌ Failed:', e.message);
      alert('Error: ' + e.message);
      isOnline = false;
    }

  } else {
    log('🔴 GOING OFFLINE...');

    try {
      if (locationInterval) {
        clearInterval(locationInterval);
        locationInterval = null;
      }

      const res = await apiFetch(`/api/driver/status`, { 
        method: 'PATCH', 
        body: JSON.stringify({ status: 'offline' }) 
      });

      if (!res.ok) throw new Error('Failed to update status');

      log('✅ NOW OFFLINE');

      document.getElementById('status_select').value = 'offline';
      updateStatusInfo('offline');

    } catch (e) {
      log('❌ Failed:', e.message);
      alert('Error: ' + e.message);
    }
  }

  updateOnlineStatus();
}

function updateOnlineStatus() {
  const btn = document.getElementById('online_btn');
  const status = document.getElementById('driver_status');
  
  if (isOnline) {
    btn.textContent = '🔴 Go Offline';
    btn.className = 'online';
    status.innerHTML = '<span class="status-badge online">🟢 ONLINE</span>';
  } else {
    btn.textContent = '🟢 Go Online';
    btn.className = '';
    status.innerHTML = '<span class="status-badge offline">🔴 OFFLINE</span>';
  }
}
// ✅ NEW: Update available delivery buttons based on capacity
function updateAvailableDeliveryButtons() {
  const canAcceptMore = activeOrders.length < maxCapacity;
  
  // Get all accept buttons in available deliveries
  const acceptButtons = document.querySelectorAll('#d_deliveries .card button.success');
  
  acceptButtons.forEach(button => {
    if (canAcceptMore) {
      button.disabled = false;
      button.style.opacity = '1';
      button.style.cursor = 'pointer';
    } else {
      button.disabled = true;
      button.style.opacity = '0.5';
      button.style.cursor = 'not-allowed';
      button.textContent = '⚠️ At Capacity';
    }
  });
  
  // Show/hide message
  if (!canAcceptMore) {
    const deliveriesBox = document.getElementById('d_deliveries');
    if (!deliveriesBox.querySelector('.capacity-warning')) {
      const warning = document.createElement('div');
      warning.className = 'card capacity-warning';
      warning.style.background = '#fef3c7';
      warning.style.borderLeft = '4px solid #f59e0b';
      warning.innerHTML = `
        <strong>⚠️ Maximum Capacity Reached</strong><br>
        <span style="font-size:13px">Complete some deliveries to accept more orders (${activeOrders.length}/${maxCapacity})</span>
      `;
      deliveriesBox.prepend(warning);
    }
  } else {
    // Remove warning if it exists
    const warning = document.querySelector('.capacity-warning');
    if (warning) warning.remove();
  }
}
async function acceptDelivery(orderId) {
  if (!auth.profile?.id) {
    alert('No driver profile!');
    return;
  }
  
  // Check capacity
  if (activeOrders.length >= maxCapacity) {
    alert(`⚠️ You are at maximum capacity (${maxCapacity} orders). Please complete some deliveries first.`);
    return;
  }
  
  log('✅ Accepting order', orderId);
  
  try {
    const r = await apiFetch(`/api/order/${orderId}/assign-driver`, {
      method: 'POST',
      body: JSON.stringify({ driver_id: auth.profile.id })
    });
    
    const j = await r.json();
    
    if (r.ok) {
      log('✅ DELIVERY ACCEPTED!');
      
      // Remove from available list
      const card = document.getElementById(`delivery_${orderId}`);
      if (card) card.remove();
      
      // Update available count
      const availableCount = document.getElementById('available_count');
      const remaining = document.querySelectorAll('#d_deliveries .card:not(.capacity-warning)').length;
      availableCount.textContent = remaining;
      
      // ✅ Reload active orders
      await loadActiveOrders();
      
      // ✅ NEW: Update available delivery buttons based on new capacity
      updateAvailableDeliveryButtons();
      
      alert('Delivery accepted! Check your active orders.');
    } else {
      alert('Error: ' + (j.message || 'Could not accept'));
      log('❌ Failed:', j.message);
    }
  } catch (e) {
    alert('Error: ' + e.message);
    log('❌ Error:', e.message);
  }
}
async function startDelivery(orderId) {
  log('🚀 Starting delivery:', orderId);
  
  try {
    const res = await apiFetch(`/api/order/${orderId}/start-delivery`, {
      method: 'POST'
    });
    
    if (res.ok) {
      log('✅ Delivery started');
      await loadActiveOrders();
    } else {
      const data = await res.json();
      alert('Error: ' + (data.message || 'Failed to start delivery'));
    }
  } catch (error) {
    alert('Error: ' + error.message);
    log('❌ Error:', error.message);
  }
}

async function completeDelivery(orderId) {
  log('✅ Completing delivery:', orderId);
  
  try {
    const res = await apiFetch(`/api/order/${orderId}/complete-delivery`, {
      method: 'POST'
    });
    
    if (res.ok) {
      log('✅ Delivery completed!');
      await loadActiveOrders();
      
      // ✅ NEW: Re-enable available delivery buttons
      updateAvailableDeliveryButtons();
      
      alert('Delivery completed successfully! 🎉');
    } else {
      const data = await res.json();
      alert('Error: ' + (data.message || 'Failed to complete delivery'));
    }
  } catch (error) {
    alert('Error: ' + error.message);
    log('❌ Error:', error.message);
  }
}

async function cancelOrder(orderId) {
  const reason = prompt('⚠️ Why are you canceling this order?\n\nPlease provide a detailed reason (minimum 10 characters):');
  
  if (!reason || reason.trim().length < 10) {
    alert('Cancellation reason must be at least 10 characters');
    return;
  }
  
  if (!confirm(`Are you sure you want to cancel this order?\n\nReason: ${reason}\n\nNote: Multiple cancellations may affect your account.`)) {
    return;
  }
  
  log('❌ Canceling order:', orderId);
  
  try {
    const res = await apiFetch(`/api/order/${orderId}/driver-cancel`, {
      method: 'POST',
      body: JSON.stringify({ reason: reason.trim() })
    });
    
    const data = await res.json();
    
    if (res.ok) {
      log('✅ Order cancelled successfully');
      
      // Show warning if exists
      if (data.warning) {
        alert('⚠️ ' + data.warning);
      }
      
      // ✅ FIX: Force reload active orders immediately
      await loadActiveOrders();
      
      // ✅ FIX: Update capacity display
      updateCapacity();
      updateAvailableDeliveryButtons();

      // Show success message
      alert('Order cancelled successfully. The system will find another driver.');
      
      log(`📊 Updated active orders: ${activeOrders.length} remaining`);
    } else {
      alert('Error: ' + (data.message || 'Failed to cancel order'));
      log('❌ Failed:', data.message);
    }
  } catch (error) {
    alert('Error: ' + error.message);
    log('❌ Error:', error.message);
  }
}

async function markArrived(orderId) {
  log('📍 Marking arrival at restaurant:', orderId);
  
  try {
    const res = await apiFetch(`/api/order/${orderId}/arrived`, {
      method: 'POST'
    });
    
    if (res.ok) {
      log('✅ Marked as arrived at restaurant');

        }
      }
    } else {
      const data = await res.json();
      alert('Error: ' + (data.message || 'Failed to mark arrival'));
    }
  } catch (error) {
    alert('Error: ' + error.message);
    log('❌ Error:', error.message);
  }
}
